{% extends "base.html" %}
{% block title %}Forgot Password — WEBWAVE{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="url(#grad3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <defs>
          <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#06b6d4"/>
          </linearGradient>
        </defs>
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        <circle cx="12" cy="16" r="1"/>
      </svg>
    </div>
    <h2>Forgot Password?</h2>
    <p class="auth-sub">Enter your email or phone number to reset</p>

    <form id="forgotForm">
      <div class="form-group">
        <label>Email or Phone Number</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input type="text" id="resetId" placeholder="you@example.com" required>
        </div>
      </div>

      <button type="submit" class="auth-btn">Send Reset Link</button>
      <p id="msg" class="error-msg"></p>
    </form>

    <p class="auth-footer">
      Remember password? <a href="/login">Sign in</a>
    </p>
  </div>
</section>

<script>
document.getElementById('forgotForm').onsubmit = function(e) {
  e.preventDefault();
  var id = document.getElementById('resetId').value.trim();
  var msg = document.getElementById('msg');

  if (!id) {
    msg.style.color = 'var(--pk)';
    msg.innerText = 'Please enter email or phone';
    return;
  }

  msg.style.color = 'var(--green)';
  msg.innerText = 'Reset link sent to ' + id + ' (demo)';
  setTimeout(function() {
    window.location.href = '/login?reset=success';
  }, 2000);
};
</script>
{% endblock %}
