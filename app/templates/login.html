{% extends "base.html" %}
{% block title %}Login — WEBWAVE{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="url(#grad1)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <defs>
          <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#06b6d4"/>
          </linearGradient>
        </defs>
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h2>Welcome Back</h2>
    <p class="auth-sub">Sign in to your account</p>

    <div id="flashMsg" class="flash-msg" style="display:none;"></div>

    <form id="loginForm" autocomplete="off" novalidate>
      <div class="form-group">
        <label for="loginId">Email or Phone Number</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input 
            type="text" 
            id="loginId" 
            placeholder="you@example.com or 9876543210" 
            required
            autocomplete="off"
          >
        </div>
        <span class="field-error" id="loginIdError"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input 
            type="password" 
            id="password" 
            placeholder="Enter your password" 
            required
            autocomplete="new-password"
          >
          <span class="input-toggle" onclick="togglePassword('password')" title="Show/Hide">
            <svg id="eyePassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </span>
        </div>
        <span class="field-error" id="passwordError"></span>
      </div>

      <div class="form-row">
        <label class="checkbox-wrap">
          <input type="checkbox" id="rememberMe">
          <span class="checkbox-custom"></span>
          <span>Remember me</span>
        </label>
        <a href="/forgot-password" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="auth-btn" id="loginBtn">
        <span class="btn-text">Sign In</span>
        <span class="btn-spinner" style="display:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
        </span>
      </button>

      <p id="errorMsg" class="error-msg"></p>
    </form>

    <div class="auth-divider"><span>OR</span></div>

    <button type="button" class="social-btn" onclick="alert('Google login coming soon!')">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <p class="auth-footer">
      Don't have an account? <a href="/signup">Create account</a>
    </p>
  </div>
</section>

<script>
function togglePassword(id) {
  var el = document.getElementById(id);
  var icon = document.getElementById('eyePassword');
  if (el.type === 'password') {
    el.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    el.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

// Flash message
window.addEventListener('DOMContentLoaded', function() {
  var params = new URLSearchParams(window.location.search);
  if (params.get('signup') === 'success') {
    var flash = document.getElementById('flashMsg');
    flash.style.display = 'block';
    flash.className = 'flash-msg flash-success';
    flash.innerText = 'Account created successfully! Please sign in.';
  }
  if (params.get('reset') === 'success') {
    var flash = document.getElementById('flashMsg');
    flash.style.display = 'block';
    flash.className = 'flash-msg flash-success';
    flash.innerText = 'Password reset successful! Please sign in with new password.';
  }

  // Remember me
  var remembered = localStorage.getItem('rememberedEmail');
  if (remembered) {
    document.getElementById('loginId').value = remembered;
    document.getElementById('rememberMe').checked = true;
  }
});

// Form submit
document.getElementById('loginForm').onsubmit = async function(e) {
  e.preventDefault();
  var loginId = document.getElementById('loginId').value.trim();
  var password = document.getElementById('password').value;
  var errEl = document.getElementById('errorMsg');
  var idErr = document.getElementById('loginIdError');
  var passErr = document.getElementById('passwordError');
  var btn = document.getElementById('loginBtn');
  var btnText = btn.querySelector('.btn-text');
  var spinner = btn.querySelector('.btn-spinner');

  errEl.innerText = '';
  idErr.innerText = '';
  idErr.style.display = 'none';
  passErr.innerText = '';
  passErr.style.display = 'none';

  // Validate
  var hasError = false;
  if (!loginId) {
    idErr.innerText = 'Email or phone number required';
    idErr.style.display = 'block';
    hasError = true;
  } else {
    // Check email OR phone
    var isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(loginId);
    var isPhone = /^[+]?[\d\s\-()]{8,15}$/.test(loginId);
    if (!isEmail && !isPhone) {
      idErr.innerText = 'Enter valid email or phone number';
      idErr.style.display = 'block';
      hasError = true;
    }
  }
  if (password.length < 6) {
    passErr.innerText = 'Password must be at least 6 characters';
    passErr.style.display = 'block';
    hasError = true;
  }
  if (hasError) return;

  btnText.style.display = 'none';
  spinner.style.display = 'inline-flex';
  btn.disabled = true;

  try {
    var res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email: loginId, password: password })
    });
    var data = await res.json();

    if (res.ok) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('name', data.name);
      localStorage.setItem('email', data.email);

      if (document.getElementById('rememberMe').checked) {
        localStorage.setItem('rememberedEmail', loginId);
      } else {
        localStorage.removeItem('rememberedEmail');
      }

      errEl.style.color = 'var(--green)';
      errEl.innerText = 'Login successful! Redirecting...';

      setTimeout(function() {
        window.location.href = '/dashboard';
      }, 500);
    } else {
      errEl.style.color = 'var(--pk)';
      errEl.innerText = data.detail || 'Invalid email or password';
      btnText.style.display = 'inline';
      spinner.style.display = 'none';
      btn.disabled = false;
    }
  } catch (err) {
    errEl.style.color = 'var(--pk)';
    errEl.innerText = 'Network error. Try again.';
    btnText.style.display = 'inline';
    spinner.style.display = 'none';
    btn.disabled = false;
  }
};
</script>
{% endblock %}
