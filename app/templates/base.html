<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}WEBWAVE{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="icon" type="image/png" href="/static/images/logo.png">
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<!-- 🎬 LOGO ANIMATION OVERLAY -->
<div id="logoLoader" class="logo-loader">
  <div class="logo-loader-inner">
    <div class="logo-ring">
      <img src="/static/images/logo.png" alt="WEBWAVE" class="logo-loader-img" onerror="this.style.display='none'">
    </div>
    <h1 class="logo-loader-text">
      <span>W</span><span>E</span><span>B</span><span class="grad-text">W</span><span class="grad-text">A</span><span class="grad-text">V</span><span class="grad-text">E</span>
    </h1>
    <p class="logo-loader-tagline">Capture the flow of opportunities</p>
  </div>
</div>

<nav class="navbar">
  <a href="/dashboard" class="brand">
    <img src="/static/images/logo.png" alt="WEBWAVE Logo" class="brand-logo" onerror="this.style.display='none'">
    <span class="brand-name">WEB<span class="grad">WAVE</span></span>
  </a>
  <div class="nav-links" id="navLinks"></div>
</nav>

{% block content %}{% endblock %}

<footer class="site-footer">
  <p>WEBWAVE &copy; 2025 — Capture the flow of opportunities</p>
</footer>

<!-- ⚠️ CHATBOT HTML REMOVED — JS will inject it dynamically -->

<script src="/static/js/main.js"></script>
<script src="/static/js/chatbot.js"></script>
<script>
  window.addEventListener('load', function() {
    setTimeout(function() {
      var loader = document.getElementById('logoLoader');
      if (loader) {
        loader.classList.add('logo-loader-hide');
        setTimeout(function() { loader.style.display = 'none'; }, 800);
      }
    }, 2500);
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
