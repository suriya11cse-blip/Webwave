<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}WEBWAVE{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<nav class="navbar">
  <a href="/dashboard" class="brand">
    <img src="/static/images/logo.png" alt="WEBWAVE Logo" class="brand-logo" onerror="this.style.display='none'">
    <span class="brand-name">WEB<span class="grad">WAVE</span></span>
  </a>
  <div class="nav-links" id="navLinks"></div>
</nav>

{% block content %}{% endblock %}

<footer class="site-footer">
  <p>WEBWAVE &copy; 2025 — Smart Job Platform</p>
</footer>

<!-- 🤖 CHATBOT — hidden by default, JS shows when logged in -->
<div id="chatToggle" style="display:none !important;">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
  </svg>
</div>

<div id="chatBox" class="chat-hidden" style="display:none !important;">
  <div class="chat-header">
    <div class="chat-title">
      <span class="chat-dot"></span> WEBWAVE AI
    </div>
    <div class="chat-actions">
      <span class="lang-btn" id="langBtn" title="Change voice language">🇬🇧 EN</span>
      <span class="voice-toggle" id="voiceToggle" title="Voice output">🔊</span>
      <span class="chat-close">✖</span>
    </div>
  </div>
  <div id="chatMessages">
    <div class="bubble bot">Vanakkam! 🙏 Naan WEBWAVE AI. Tamil, English, Hindi — enna language-layum pesalam. Jobs, courses pathi kelunga!</div>
  </div>
  <div class="chat-input-wrap">
    <button class="mic-btn" id="micBtn" title="Voice input">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
    <input id="chatInput" placeholder="Type or speak...">
    <button id="sendBtn" title="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script src="/static/js/chatbot.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
