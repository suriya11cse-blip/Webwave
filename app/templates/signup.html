{% extends "base.html" %}
{% block title %}Signup — WEBWAVE{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="/static/images/logo.png" alt="WEBWAVE" onerror="this.style.display='none'">
    </div>
    <h2>Create Account</h2>
    <p class="auth-sub">Join WEBWAVE and unlock all opportunities</p>

    <form id="signupForm" autocomplete="off" novalidate>
      <div class="form-group">
        <label for="name">Full Name</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input type="text" id="name" placeholder="Your full name" required autocomplete="off">
        </div>
        <span class="field-error" id="nameError"></span>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="off">
        </div>
        <span class="field-error" id="emailError"></span>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <div class="input-wrap phone-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </span>
          <select id="countryCode" class="country-code">
            <option value="+91">IN +91</option>
            <option value="+1">US +1</option>
            <option value="+44">UK +44</option>
            <option value="+971">AE +971</option>
            <option value="+65">SG +65</option>
            <option value="+60">MY +60</option>
          </select>
          <input type="tel" id="phone" placeholder="98765 43210" required autocomplete="off" maxlength="15">
        </div>
        <span class="field-error" id="phoneError"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="password" placeholder="Min 8 characters" required autocomplete="new-password">
          <span class="input-toggle" onclick="togglePassword('password', 'eyePassword1')" title="Show/Hide">
            <svg id="eyePassword1" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </span>
        </div>
        <div class="strength-bar">
          <div class="strength-fill" id="strengthFill"></div>
        </div>
        <span class="strength-text" id="strengthText"></span>
        <span class="field-error" id="passwordError"></span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              <circle cx="12" cy="16" r="1"/>
            </svg>
          </span>
          <input type="password" id="confirmPassword" placeholder="Re-enter password" required autocomplete="new-password">
          <span class="input-toggle" onclick="togglePassword('confirmPassword', 'eyePassword2')" title="Show/Hide">
            <svg id="eyePassword2" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </span>
        </div>
        <span class="field-error" id="confirmError"></span>
      </div>

      <div class="form-row">
        <label class="checkbox-wrap">
          <input type="checkbox" id="terms" required>
          <span class="checkbox-custom"></span>
          <span>I agree to the <a href="#" onclick="alert('Terms page coming soon!');return false;">Terms</a> & <a href="#" onclick="alert('Privacy page coming soon!');return false;">Privacy</a></span>
        </label>
      </div>

      <button type="submit" class="auth-btn" id="signupBtn">
        <span class="btn-text">Create Account</span>
        <span class="btn-spinner" style="display:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
        </span>
      </button>

      <p id="errorMsg" class="error-msg"></p>
      <p id="successMsg" class="success-msg"></p>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="/login">Sign in</a>
    </p>
  </div>
</section>

<script>
function togglePassword(id, iconId) {
  var el = document.getElementById(id);
  var icon = document.getElementById(iconId);
  if (el.type === 'password') {
    el.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    el.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

document.getElementById('password').addEventListener('input', function() {
  var pass = this.value;
  var fill = document.getElementById('strengthFill');
  var text = document.getElementById('strengthText');
  var strength = 0;
  if (pass.length >= 8) strength++;
  if (/[a-z]/.test(pass)) strength++;
  if (/[A-Z]/.test(pass)) strength++;
  if (/[0-9]/.test(pass)) strength++;
  if (/[^a-zA-Z0-9]/.test(pass)) strength++;
  var pct = (strength / 5) * 100;
  fill.style.width = pct + '%';
  if (strength <= 2) {
    fill.style.background = '#ef4444';
    text.innerText = 'Weak';
    text.style.color = '#ef4444';
  } else if (strength === 3) {
    fill.style.background = '#f59e0b';
    text.innerText = 'Medium';
    text.style.color = '#f59e0b';
  } else {
    fill.style.background = '#22c55e';
    text.innerText = 'Strong';
    text.style.color = '#22c55e';
  }
});

document.getElementById('signupForm').onsubmit = async function(e) {
  e.preventDefault();
  var name = document.getElementById('name').value.trim();
  var email = document.getElementById('email').value.trim();
  var countryCode = document.getElementById('countryCode').value;
  var phone = document.getElementById('phone').value.trim();
  var password = document.getElementById('password').value;
  var confirm = document.getElementById('confirmPassword').value;
  var terms = document.getElementById('terms').checked;
  var errEl = document.getElementById('errorMsg');
  var okEl = document.getElementById('successMsg');
  var btn = document.getElementById('signupBtn');
  var btnText = btn.querySelector('.btn-text');
  var spinner = btn.querySelector('.btn-spinner');

  errEl.innerText = '';
  okEl.innerText = '';
  document.querySelectorAll('.field-error').forEach(function(el) {
    el.innerText = '';
    el.style.display = 'none';
  });

  var hasError = false;
  if (name.length < 2) { showErr('nameError', 'Enter your full name'); hasError = true; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('emailError', 'Valid email required'); hasError = true; }
  if (phone.replace(/\D/g, '').length < 8) { showErr('phoneError', 'Valid phone number required'); hasError = true; }
  if (password.length < 8) { showErr('passwordError', 'Password must be at least 8 characters'); hasError = true; }
  if (password !== confirm) { showErr('confirmError', 'Passwords do not match'); hasError = true; }
  if (!terms) {
    errEl.style.color = '#f87171';
    errEl.innerText = 'Please accept Terms & Privacy';
    hasError = true;
  }
  if (hasError) return;

  var fullPhone = countryCode + phone.replace(/\D/g, '');
  btnText.style.display = 'none';
  spinner.style.display = 'inline-flex';
  btn.disabled = true;

  try {
    var res = await fetch('/api/auth/signup', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name: name, email: email, phone: fullPhone, password: password })
    });
    var data = await res.json();

    if (res.ok) {
      okEl.innerText = 'Account created! Redirecting to login...';
      btn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
      btnText.innerText = 'Success!';
      btnText.style.display = 'inline';
      spinner.style.display = 'none';
      setTimeout(function() {
        window.location.href = '/login?signup=success';
      }, 1500);
    } else {
      errEl.style.color = '#f87171';
      errEl.innerText = data.detail || 'Signup failed';
      btnText.style.display = 'inline';
      spinner.style.display = 'none';
      btn.disabled = false;
    }
  } catch (err) {
    errEl.style.color = '#f87171';
    errEl.innerText = 'Network error. Try again.';
    btnText.style.display = 'inline';
    spinner.style.display = 'none';
    btn.disabled = false;
  }
};

function showErr(id, msg) {
  var el = document.getElementById(id);
  el.innerText = msg;
  el.style.display = 'block';
}
</script>
{% endblock %}
